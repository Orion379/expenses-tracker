{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign out · ExpenseTracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="auth-page" data-page="logout">
    <div class="auth-decoration">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="auth-caption"><span class="brand-mark">e</span>
            <h2>Make room for<br>what matters.</h2>
            <p>See your spending clearly. Plan with confidence.</p>
        </div>
    </div>
    <main class="auth-main">
        <div class="auth-card logout-card">
            <div class="logout-symbol">↗</div>
            <p class="eyebrow">SEE YOU SOON</p>
            <h1>Sign out of ExpenseTrack?</h1>
            <p class="muted"> You can sign back in anytime.</p>
            <div class="logout-actions"><form method="post" action="{% url 'users:logout' %}" style="margin:0">{% csrf_token %}<button class="btn btn-primary btn-full" id="confirmLogout" type="submit" style="width:100%">Yes, sign me out</button></form><a class="btn btn-secondary btn-full" href="{% url 'dashboard' %}">Stay signed in</a></div>
        </div>
    </main>
    <script src="{% static 'js/page.js' %}" defer></script>
</body>
</html>
